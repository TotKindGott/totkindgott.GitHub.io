    <script>
        
    function toggleFilter() {
        var f = document.getElementById('filterTable');
        var l = document.getElementById('filterToggle');
        if(f.style.display == 'none') {
            f.style.display = 'table';
            NOTE("column filter exposed");
        } else {
            f.style.display = 'none';
            NOTE("column filter hidden");
        };
    };
    
    function toggleCol(name) {
        let cells = document.getElementsByClassName(name);
        let state = "";
        
        for(var i = 0; i < cells.length; i++) {
            var e = cells[i];
            var t = document.getElementById(name+'Toggle');
            if (e.style.display !== 'none') {
                e.style.display = 'none';
                t.style.color = 'silver';
                state = false;
            } else {
                e.style.display = 'table-cell';
                t.style.color = 'black';
                state = true;
            };
        };
        NOTE("column", name, "toggled", state);
    };
    
    function onMouseOver(name) {
        cells = document.getElementsByClassName(name);
        for(var i = 0; i < cells.length; i++) {
            var e = cells[i]
            e.classList.add('highlighted')
        };
    };
    
    function onMouseOut(name) {	
        cells = document.getElementsByClassName(name);
        for(var i = 0; i < cells.length; i++) {
            var e = cells[i]
            e.classList.remove('highlighted');
        };
    };
    
    function searchLines() {
        // searches through data-index attribute of every carDiv
        LOG(">>> running searchLines() ...")
        let search_query = document.getElementById('search_bar').value;
        let count = 0;
        OPTION("searching for", search_query);
        search_query = search_query.toLowerCase();
        let carDivs = document.getElementsByClassName('searchable');
        for (i = 0; i < carDivs.length; i++) {
            if (
            carDivs[i].getAttribute("data-index").toLowerCase().includes(search_query)) {
                    carDivs[i].style.display = "table-row";
                carDivs[i].classList.add("visible");
                count += 1;
            }
            else {
                carDivs[i].style.display = "none";
                carDivs[i].classList.remove("visible");
            }
        };
        NOTE("searchLines() returned", count, "matches");
        LOG("<hr />");
        updateCount(count);
        //positionFooter();
    };

    function printTable() {
        var printContents = document.getElementById('mainTableDiv').innerHTML;
        var originalContents = document.body.innerHTML;
    
        document.body.innerHTML = printContents; // Temporarily replace body content
        window.print(); // Trigger browser print dialog
        document.body.innerHTML = originalContents; // Restore original content
    };
    
    document.getElementById("search_bar").addEventListener("change", searchLines);
</script>

    <script>
        
function parseCSV() {

    let start = performance.now();
    LOG(">>> running parseCSV() in this file ...");
    let count = 0;
    let csv =  document.getElementById("csv").innerHTML;
    let models = new Array();
    let lines = csv.split("\n");
    let headers = lines.shift();
    NOTE(lines.length, "lines in csv");

    lines.forEach(line => {
        if (!line) { // omit on empty
            return;
        }
        count += 1;
        try {
            let csvalues = line.split(",");
            let _name = csvalues[3];
            let _series = csvalues[0];
            let _year = csvalues[1];
            let _tag = csvalues[9];
            let _image = csvalues[11];
            let _condition = csvalues[6];
            let _part = csvalues[2];
            let _number = csvalues[4];
            let _origin = csvalues[7];
            let _stamp = csvalues[5];
            let _url = csvalues[8];
            let _note = csvalues[12];
            let _quantity = csvalues[10]; 
            let _data_index = `${_name} ${_series} year:${_year} tag:${_tag} ${_origin} ${_note}`;
            let _row_class = "";
            if (_quantity == "") {
                _quantity = 1;
            };
            if (_quantity == 0) {
                _row_class = "zero";
            };
        
            let table_row = `
        <tr class="searchable ${_row_class}" data-index="${_data_index}">
            <td class="line" onclick="generateAndCopyImageName(this)">${count}</td>
            <td class="model" onclick="generateModelView(this)">${_name}</td>
            <td class="series">${_series}</td>
            <td class="year">${_year}</td>
            <td class="part">${_part}</td>
            <td class="origin">${_origin}</td>
            <td class="url">${_url}</td>
            <td class="quantity">${_quantity}</td>
            <td class="tags">${_tag}</td>
            <td class="condition">${_condition}</td>
            <td class="image">${_image}</td>
            <td class="note">${_note}</td>
        </tr>`
            models.push(table_row);
        } catch (error) {
            count -= 1;
            NOTE("line:", line);
            ERROR("error:", error);
            return;
        };
        //LOG(line);
        //LOG(new Model(count, line).make_spreadsheet_line());
        });

    NOTE(models.length, "models processed");
    let end = performance.now();
    NOTE(`parseCSV() executed in ${Number((end - start)/1000).toFixed(2)} s`);
    SUCCESS("parseCSV() run status: OK");
    return models.join("\n");
};

function generateAndCopyImageName(obj) {
    let _series = obj.parentElement.querySelector('.series').innerText;
    let _year = obj.parentElement.querySelector('.year').innerText;
    let _part = obj.parentElement.querySelector('.part').innerText;
    let _name = obj.parentElement.querySelector('.model').innerText;
    //let _number = obj.parentElement.querySelector('.number').innerText;
    let _number = "";
    let _stamp = "";
    let _origin = obj.parentElement.querySelector('.origin').innerText;    
    let _url = obj.parentElement.querySelector('.url').innerText;    
    let _quantity = obj.parentElement.querySelector('.quantity').innerText;
    let _tag = obj.parentElement.querySelector('.tags').innerText;
    let _condition = obj.parentElement.querySelector('.condition').innerText;
    let _image = obj.parentElement.querySelector('.image').innerText;
    let _note = obj.parentElement.querySelector('.note').innerText;    
    let image_name = generateImageName(generateCSV(_series, _year, _part, _name, _number, _stamp, _condition, _origin, _url, _tag, _quantity, _image, _note));
    CLIP(image_name);
    copy(image_name);
    showNotification(image_name);
};

function generateModelView(obj) {
    let _series = obj.parentElement.querySelector('.series').innerText;
    let _year = obj.parentElement.querySelector('.year').innerText;
    let _part = obj.parentElement.querySelector('.part').innerText;
    let _name = obj.parentElement.querySelector('.model').innerText;
    //let _number = obj.parentElement.querySelector('.number').innerText;
    let _number = "";
    let _stamp = "";
    let _origin = obj.parentElement.querySelector('.origin').innerText;    
    let _url = obj.parentElement.querySelector('.url').innerText;    
    let _quantity = obj.parentElement.querySelector('.quantity').innerText;
    let _tag = obj.parentElement.querySelector('.tags').innerText;
    let _condition = obj.parentElement.querySelector('.condition').innerText;
    let _image = obj.parentElement.querySelector('.image').innerText;
    let _note = obj.parentElement.querySelector('.note').innerText;    
    let model = new Model(0, generateCSV(_series, _year, _part, _name, _number, _stamp, _condition, _origin, _url, _tag, _quantity, _image, _note));
    let card = document.getElementById("card_view");
    let cardview = document.getElementById("carousel");
    card.innerHTML = model.make_frame_view();
    NOTE("cardview generated for", _name);
    cardview.style.display = "block";
    
    let cells = obj.parentElement.getElementsByTagName("td");
    for(var i = 0; i < cells.length; i++) {
            let e = cells[i];
            e.classList.add('highlighted');
            setTimeout(() => {
                e.classList.remove('highlighted');
                if (e.className == "line") {
                    e.classList.add("seen");
                };
            }, 5000);
        };
};

function hideCardView() {
    let cardview = document.getElementById("carousel");
    cardview.style.display = "none";
}

async function initSpreadsheet() {
    let start = performance.now();
    LOG(">>> running initSpreadsheet() in this file ...");
    await getCSV();
    document.getElementById("main_table").innerHTML = await parseCSV();
    toggleFilter();    
    toggleCol('url'); 
    toggleCol('part'); 
    toggleCol('origin'); 
    toggleCol('quantity'); 
    toggleCol('condition');
    toggleCol('image');
    toggleCol('note');
    let end = performance.now();
    NOTE(`initSpreadsheet() executed in ${Number((end - start)/1000).toFixed(2)} s`);
    SUCCESS("initSpreadsheet() run status: OK");
    LOG("<hr />");
}
