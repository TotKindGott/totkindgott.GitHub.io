const getJSON = async () => {

    try {

            document.getElementById("json_data").innerText = data;
            SUCCESS(`fetch("${json_file}") response status: ${res.status}`);
            NOTE(`fetched ${data.length.toLocaleString("en-US")} characters`);
        } else {
            ERROR(`Error: file ${json_file} not found`);
            return false;
        };

    };
    let end = performance.now();
    NOTE(`getJSON() executed in <span class="tag time">${Number((end - start)/1000).toFixed(2)}s</span>`);
    SUCCESS("getJSON() run status: OK");
    return this;
};

class Inventory {
    constructor() {
        this.stores = new Array();
        this.dates = new Array();
        this.cities = new Array();
        this.visit_count = 0;
        this.store_count = 0;
        this.date_count = 0;
        NOTE("Instance of class Inventory initialized");
    };
    
    add_store(name, city, address) {
        //this.stores[name].append(address);
        
        this.stores[name] ??= new Array();
        //this.stores[store].push(inventories[city][store][address]);
        this.stores[name][address.split(",").at(0) + ", " + city] ??= new Array();
        //this.stores[name].push(address);
        this.cities[city] ??= new Array();
        this.cities[city].push(new Array());
        this.visit_count += Object.keys(inventories[city][name][address]).length;
        this.store_count += 1;
        Object.keys(inventories[city][name][address]).forEach(date => {
            this.dates[date] ??= new Array();
            this.dates[date].push(inventories[city][name][address][date])
        })
        
    }; // add_stores() ends
    
    update_numbers() {
        this.date_count = Object.keys(this.dates).length;
        
        document.getElementById("visit_count").innerText = this.visit_count;
        document.getElementById("store_count").innerText = this.store_count;
        document.getElementById("date_count").innerText = this.date_count;
    }

};

async function parseJSON() {

function parseCities() {
    return Object.keys(inventories).sort();
};

function parseStores(city) {
    return Object.keys(inventories[city]).sort();
};

function parseAddresses(city, store) {
    return Object.keys(inventories[city][store]).sort();
};

function parseVisits(city, store, address) {
    return Object.entries(inventories[city][store][address]).sort();
};

};

};

function selectAddress(city, store) {

    TITLE(store + " in " + city);
    parseAddresses(city, store).forEach(address => {
        INLINE_BUTTON(address, "selectVisit('" + city + "', '" + store + "', '" + address + "')");
    });

};

function selectVisit(city, store, address) {

    TITLE(store + " @ " + address + ", " + city);
    parseVisits(city, store, address).sort().reverse().forEach(visit => {
        let [_date, _stock] = visit.toString().split(",");
        
        let days_of_week = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"]
        
        let _now = Date.now();
        let _then = new Date(_date);
        let _day = days_of_week.at(_then.getDay());
        
        let diff = parseInt((_now - _then) / (1000 * 60 * 60 * 24));
        
        if (_stock >= 95) {
            HIGHLIGHT(_stock.toString().padStart(3, " ") + '%   ' + _date + "   " + diff.toString().padStart(3, " ") + " days ago   " + _day);
        } else {
            NOTE(_stock.toString().padStart(3, " ") + '%   ' + _date + "   " + diff.toString().padStart(3, " ") + " days ago   " + _day);
        };
    });

    //document.getElementById("messages").innerHTML += makeInventoryHTML(store, address, city);
};

function makeInventoryHTML(store, address, city) {
    
    let date_now = Date.now();
    let stock_levels = new Array();
    let days_of_week = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"]
    Inv.add_store(store, city, address);
    Object.entries(inventories[city][store][address]).sort().reverse().forEach(([date, stock]) => {
        
        let _then = new Date(date);
        let day = days_of_week.at(_then.getDay());
        
        let timelapse = parseInt((date_now - _then) / (1000 * 60 * 60 * 24));
        
        if (stock >= 95) {
            stock_html = `<td class="inventory full">${stock}%</td>`;
        } else if (stock >= 80) {
            stock_html = `<td class="inventory almost_full">${stock}%</td>`;
        } else if (stock >= 50) {
            stock_html = `<td class="inventory half_full">${stock}%</td>`;
        } else {
            stock_html = `<td class="inventory barely_full">${stock}%</td>`;
        };
        let date_html = `<td class="date">${date}</td>`;
        let timelapse_html = `<td class="timelapse">${timelapse} days ago</td>`;
        let day_of_week_html = `<td class="day">${day}</td>`
        stock_levels.push(`<tr>${stock_html}\n${date_html}\n${timelapse_html}\n${day_of_week_html}\n</tr>`)
    });
    
    let header_html = `<div class="searchable" data-index="${city} ${store} ${address}">\n<table class="store">\n<tbody>\n<colgroup>\n<col style="width: 10%">\n<col style="width: 30%">\n<col style="width: 35%">\n<col style="width: 25%">\n</colgroup>\n<tr class="subheader">\n<td colspan="2" class="store_name">${store}</td>\n<td colspan="2" class="right address">${address}, ${city}</td>\n</tr>`
    
    return `${header_html}\n${stock_levels.join("\n")}\n</tr>\n</table>`
    
};

function addContent(content) {
    document.getElementById("content").innerHTML += content;
};

function makePageContent() {
    
    let start = performance.now();
    LOG(">>> makePageContent() <span class='tag path'>here</span>");
    Object.keys(inventories).sort().forEach(city => {
        Object.keys(inventories[city]).sort().forEach(store => {
            Object.keys(inventories[city][store]).sort().forEach(address => {
                addContent(makeInventoryHTML(store, address, city));
            });
        });
    });
    let end = performance.now();
    NOTE(`makePageContent() executed in <span class="tag time">${Number((end - start)/1000).toFixed(2)}s</span>`);
    SUCCESS("makePageContent() run status: OK");
};
