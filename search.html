function timed(func) {
    return function (...args) {
        let start_time = performance.now();
        LOG(`>>> running ${func.name}() ...`)
        const result = func(...args);
        let end_time = performance.now();
        NOTE(`${func.name}() executed in ${Number((end_time - start_time)/1000).toFixed(2)} s`);
        return result;
    };
};

function match() {
    
    if (search_result.length < 1) {
        LOG(">>> match() redirecting to search()");
        return search();
        //return;
    };
    
    NOTE("tracker.compare() state: " + tracker.compare());
    tracker.set();
    let start = performance.now();
    
    //LOG("<hr />");
    LOG(">>> running match() on", search_result.length, "objects from recent search for", searchBar.value);
    
    let matched = new Array();
    let filter = new Filter();
    
    let _tag = tagSelectorInput.value;
    let _year = yearSelectorInput.value;
    let _series = seriesSelectorInput.value;
    let _source = sourceSelectorInput.value;
    let _condition = conditionSelectorInput.value;
    
    _tag ? OPTION("with tag:", _tag) : void(0);
    _year ? OPTION("with year:", _year) : void(0);
    _series ? OPTION("with series:", _series) : void(0);
    _source ? OPTION("with source:", _source) : void(0);
    _condition ? OPTION("with condition:", _condition) : void(0);
    LOG("<hr />");
    
    search_result.forEach(m => {
        if (m.series.toLowerCase().includes(_series.toLowerCase()) && m.tag.toLowerCase().includes(_tag.toLowerCase()) && m.year.toString().includes(_year) && m.condition.toLowerCase().includes(_condition.toLowerCase()) && m.origin.toLowerCase().includes(_source.toLowerCase())) {
            matched.push(m);
            filter.add_data(m);
        }; // if block ends
    }); // forEach block ends
    NOTE("match() returned", matched.length,   matched.length == 1 ? "item" : "items");
    
    display(matched);
    //filter.apply_filters();
    updateCount(matched.length);
    
    let end = performance.now();
    NOTE(`match() executed in ${Number((end - start)/1000).toFixed(2)} s`);
    matched.length > 0 ? SUCCESS(`match() run status: OK [ ${matched.length} ${matched.length == 1 ? "item" : "items"} ]`) & (CONSOLE_STATE == "" && hideMessages()) : ERROR('match() run status: error [0 matches]') & openMessages();
    LOG("<hr />");
    
}; // match() declaration ends

function processResults(models) { // expects a list of strings ( csv lines??? )
    LOG(">>> running processResults()  <span class='codepath'>./search.html</span>");
    let _count = 0;
    let _filter = new Filter();
    let _subcollection = new Collection();
    models.forEach(model => {
        _count += 1;
        m = new Model(_count, model);
        _subcollection.add(model);
        _filter.add_data(m)
    }); // forEach loop ends
    if (_subcollection.models.length > 0) {
        SUCCESS("processResults() run status: OK");
        return _filter.models;
    } else {
        ERROR("processResults() run status: ERROR");
    };
};

function display(models) {
    LOG(">>> running display() <span class='codepath'>./search.html</span>");
    
    let lines = new Array();
    let images = new Array();
    let count = 0;
    let result = new Array();
    let filter = new Filter();
    let _missing_photos = new Set();

    models.forEach(model => { // expects object of type Model
        if (typeof model == "string") {
            //ERROR("Error in display(): expecting object not string");
            model = new Model(count, model);
            count += 1;
        };
        f = model.make_card_view();
        lines.push(f);
        i = model.make_thumbnail_view();
        images.push(i);
        filter.add_data(model);
        _missing_photos.add(model.missing_photo);
    document.getElementById("card_view").innerHTML = lines.join('');
    document.getElementById("item_list").innerHTML = images.join("");
    result.push(model);
    }); // for loop ends
    //search_result = result;
    filter.apply_filters();
    setActivationEvent();
    results_missing_photo = [..._missing_photos].sort();
    if (results_missing_photo[0] == "") {
        results_missing_photo.pop()
    };
    if (results_missing_photo.length > 0) {
        INLINE_ACTION("items with missing photos: " + results_missing_photo.length, `results_missing_photo.forEach(photo => {
                CLIP(photo);
            });`);
    };
    results_missing_photo.forEach(photo => {
                CLIP(photo);
            });
    SUCCESS(`display() run status: OK [ ${result.length} ${result.length == 1 ? "item" : "items"} ]`);
    LOG("<hr />");

}; // display() declaration ends
