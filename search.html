function timed(func) {
    return function (...args) {
        let start_time = performance.now();
        LOG(`>>> ${func.name}() ...`)
        const result = func(...args);
        let end_time = performance.now();
        NOTE(`${func.name}() executed in <span class="tag time">${Number((end - start)/1000).toFixed(2)}s</span>`);
        return result;
    };
};

function match() {
    
    if (search_result.length < 1) {
        LOG(">>> match() redirecting to search()");
        return search();
        //return;
    };
    
    NOTE("tracker.compare() state: " + tracker.compare());
    tracker.set();
    let start = performance.now();
    
    //LOG("<hr />");
    LOG(">>> match() on", search_result.length, "objects from recent search for", searchBar.value);
    
    let matched = new Array();
    let filter = new SearchFilter();
    
    let _tag = tagSelectorInput.value;
    let _year = yearSelectorInput.value;
    let _series = seriesSelectorInput.value;
    let _source = sourceSelectorInput.value;
    let _condition = conditionSelectorInput.value;
    
    _tag ? OPTION(`tag detected: <span class="selection">${_tag}</span>`) : void(0);
    _year ? OPTION(`year detected: <span class="selection">${_year}</span>`) : void(0);
    _series ? OPTION(`series detected: <span class="selection">${_series}</span>`) : void(0);
    _source ? OPTION(`source detected: <span class="selection">${_source}</span>`) : void(0);
    _condition ? OPTION(`condition detected: <span class="selection">${_condition}</span>`) : void(0);
    
    search_result.forEach(m => {
        if (m.series.toLowerCase().includes(_series.toLowerCase()) && m.tag.toLowerCase().includes(_tag.toLowerCase()) && m.year.toString().includes(_year) && m.condition.toLowerCase().includes(_condition.toLowerCase()) && m.origin.toLowerCase().includes(_source.toLowerCase())) {
            matched.push(m);
            filter.add_data(m);
        }; // if block ends
    }); // forEach block ends
    NOTE("match() returned", matched.length,   matched.length == 1 ? "item" : "items");
    
    display(matched);
    //filter.apply_filters();
    updateCount(matched.length);
    
    let end = performance.now();
    NOTE(`match() executed in <span class="tag time">${Number((end - start)/1000).toFixed(2)}s</span>`);
    matched.length > 0 ? SUCCESS(`match() run status: OK [ ${matched.length} ${matched.length == 1 ? "item" : "items"} ]`) & (CONSOLE_STATE == "" && hideMessages()) : ERROR('match() run status: error [0 matches]') & openMessages();
    
}; // match() declaration ends

function processResults(models) { // expects a list of strings ( csv lines??? )

    let _count = 0;
    let _filter = new SearchFilter();
    let _subcollection = new Collection();
    models.forEach(model => {
        _count += 1;
        m = new Model(_count, model);
        _subcollection.add(model);
        _filter.add_data(m)
    }); // forEach loop ends
    if (_subcollection.models.length > 0) {
        SUCCESS("processResults() run status: OK");

};

function splitInto(columns, list) {
    let result = new Array();
    let chunk;
    let _list = [...list];
    //LOG("WORKING ON ", list)
    _list.splice(_list.indexOf('undefined'), 1);

    
    if (_list.length / columns % 0) {
        chunk = _list.length / columns;
    } else {
        chunk = Math.ceil(_list.length / columns);
    }
    //NOTE("original length:", list.length);
    //NOTE("new list length:", _list.length);
    //NOTE("column length:", chunk);

    for (var i = 0; i < columns; i++) {
        result.push(_list.slice(0, chunk));
        _list.splice(0, chunk);
        };
    //NOTE(result);
    return result;
}

function reprCols(list, data, name, id) {
    let _lines = new Array();
    let column_height = list.at(0).length;
    //LOG("column height:", column_height)
    for (var i = 0; i < column_height; i++) {
        
        let _line = new Array();
        list.forEach(l => {
            let _item = l.shift();
            if (_item == undefined) {
                //ERROR("UNDEFINED found");
            } else if (_item == "") {
                //WARN("NO YEAR found");
                _line.push(`<td class="key">    </td> <td class="value">${data[_item].length}</td>`);
            } else {
                _line.push(`<td class="key">${_item}</td> <td class="value">${data[_item].length}</td>`);
            };
        });
        _lines.push(`<tr>${_line.join("\t")}</tr>`);
    };
    
    let result = `      <table class="stats" id="${id}" style="">
       <tbody>
           <tr class="subheader">
               <td colspan="6" style="text-align: center;">Models by ${name}</td>
           </tr>
           ${_lines.join("\n")}
        </tbody>
    </table>`


    //for (var i = 0; i < column_height; i++) {
        //OPTION(_lines.at(i));
    //};
    
    //return result;
    document.getElementById("messages").innerHTML += result;
};

    reprCols(splitInto(2, Object.keys(cars.conditions).sort()), cars.conditions, "Condition", "stats_by_condition");
    
    reprCols(splitInto(2, Object.keys(cars.sources).sort()), cars.sources, "Source", "stats_by_source");

    let end = performance.now();
    NOTE(`\nstatsInConsole() executed in <span class="tag time">${Number((end - start)/1000).toFixed(2)}s</span>`);
    
}

INLINE_BUTTON("Collection Statistics".toUpperCase(), "statsInConsole()");
